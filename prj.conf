# Own USP + LBM LoRaWAN app (not Zephyr CONFIG_LORAWAN / loramac-node).

# --- Board peripherals ---
CONFIG_GPIO=y                          # LED and SX1262 DIO, reset, and busy signals
CONFIG_SPI=y                           # SX1262 bus
CONFIG_SERIAL=y                        # UART subsystem; this board uses USB CDC

# --- Console (overlay: zephyr,console = cdc_acm_uart0) ---
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y                  # Route printk and LOG through the UART console
CONFIG_UART_LINE_CTRL=y                # CDC DTR used by wait_usb_console()
CONFIG_USE_SEGGER_RTT=n                # Keep logs off the J-Link RTT backend

# --- USB CDC ACM virtual serial console ---
CONFIG_USB_DEVICE_STACK_NEXT=y         # Next-generation USB device stack
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y
CONFIG_CDC_ACM_SERIAL_PRODUCT_STRING="RAK4631 USP"
# Delay logging until USB enumeration completes. Keep numeric assignments on their own lines.
CONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=4000
CONFIG_USBD_CDC_ACM_LOG_LEVEL_OFF=y    # Silence USB stack messages during enumeration
CONFIG_USBD_LOG_LEVEL_OFF=y

# --- Logging and memory ---
CONFIG_LOG=y
CONFIG_LOG_BACKEND_SHOW_COLOR=n        # CDC output is not a color terminal
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=8192
CONFIG_MAIN_STACK_SIZE=4096

# --- Storage, power management, and random numbers ---
CONFIG_FLASH=y                         # LBM stores the join session in NVM
CONFIG_PM_DEVICE=y                     # Device power management used by the radio driver
CONFIG_TEST_RANDOM_GENERATOR=y         # Software PRNG used for values such as Join DevNonce

# --- Disable native Zephyr LoRa/LoRaWAN to keep exclusive ownership of the SX1262 ---
CONFIG_LORA=n
CONFIG_LORAWAN=n

# --- RZI C SDK (backend dependencies are owned by its Kconfig) ---
CONFIG_RZI=y
CONFIG_RZI_LORAWAN=y
CONFIG_BOARD_EARLY_INIT_HOOK=y         # Temporary compatibility for the pinned RAK4631 BSP
CONFIG_LORA_BASICS_MODEM_DRIVERS_EVENT_TRIGGER_NO_THREAD=y  # Handle DIO IRQs without an intermediate thread

# --- Thread priorities (negative values are cooperative; lower values run first) ---
# USP (-4) runs before main (-2) whenever main yields.
CONFIG_MAIN_THREAD_PRIORITY=-2
CONFIG_USP_MAIN_THREAD_PRIORITY=-4
