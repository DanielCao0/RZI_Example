# SPDX-License-Identifier: Apache-2.0
# Customer application manifest. RZI is consumed as an independent west project;
# Zephyr and the default USP backend dependencies are imported from the RZI
# manifest, so the Zephyr revision follows the one RZI is validated against.

manifest:
  version: "1.2"

  self:
    path: app

  remotes:
    - name: rzi-origin
      url-base: https://github.com/DanielCao0

  projects:
    - name: rzi
      repo-path: RZI
      remote: rzi-origin
      revision: main
      import: true
