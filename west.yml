# Customer application manifest. RZI is consumed as an independent west project;
# the default USP backend dependencies are imported from the RZI manifest.

manifest:
  version: "1.2"

  self:
    path: app

  remotes:
    - name: zephyrproject-rtos
      url-base: https://github.com/zephyrproject-rtos
    - name: rzi-origin
      url-base: https://github.com/DanielCao0

  projects:
    - name: zephyr
      remote: zephyrproject-rtos
      revision: fa4f8fb0e470210aee0ae6fb069a281bc6ac887a # v4.5.0-rc1
      import: true

    - name: rzi
      repo-path: RZI
      remote: rzi-origin
      revision: main
      import: true
